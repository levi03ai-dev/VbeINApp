<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2a1b15" />
      <stop offset="60%" stop-color="#140d0b" />
      <stop offset="100%" stop-color="#090504" />
    </radialGradient>

    <!-- Vibrant Brand Gradient -->
    <linearGradient id="vibe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b54" />
      <stop offset="40%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#9d211b" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle with rich dark finish -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255, 123, 84, 0.08)" stroke-width="4" />

  <!-- Main Animated/Dynamic 'V' combined with Waveform Monogram -->
  <g transform="translate(136, 126)" filter="url(#neon-glow)">
    <!-- Wave 1 (Left Wing background) -->
    <path d="M 12 40 C 25 100, 40 180, 120 230 C 100 150, 80 80, 60 40 Z" fill="url(#vibe-grad)" opacity="0.35" />
    
    <!-- Main Left Wing of V -->
    <path d="M 30 20 C 45 90, 65 170, 120 240 C 110 160, 95 100, 75 20 Z" fill="url(#vibe-grad)" />

    <!-- Wave 2 (Center sound frequency vertical bars) -->
    <rect x="110" y="50" width="12" height="120" rx="6" fill="url(#vibe-grad)" opacity="0.85" />
    <rect x="128" y="70" width="12" height="90" rx="6" fill="url(#vibe-grad)" opacity="0.9" />
    <rect x="146" y="40" width="12" height="150" rx="6" fill="url(#vibe-grad)" />
    <rect x="164" y="85" width="12" height="70" rx="6" fill="url(#vibe-grad)" opacity="0.8" />

    <!-- Main Right Wing of V -->
    <path d="M 210 20 C 195 90, 175 170, 120 240 C 130 160, 145 100, 165 20 Z" fill="url(#vibe-grad)" />
    
    <!-- Wave 3 (Right Wing background) -->
    <path d="M 228 40 C 215 100, 200 180, 120 230 C 140 150, 160 80, 180 40 Z" fill="url(#vibe-grad)" opacity="0.35" />
  </g>

  <!-- Glowing Dot representing 'IN' -->
  <circle cx="256" cy="380" r="16" fill="#ff7b54" filter="url(#neon-glow)" />
</svg>
